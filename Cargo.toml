[workspace]
members = [
    "crates/vectorseam-core",
    "crates/vectorseam-collector",
    "crates/vectorseam-recommendation-server",
    "crates/vectorseam-runtime",
    "crates/seam",
]
resolver = "3"

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/MaciekLesiczka/vectorseam"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.7", default-features = false, features = ["http1", "tokio"] }
bytes = "1.11.0"
clap = { version = "4.6.1", features = ["derive", "env"] }
futures-util = "0.3.31"
hyper = { version = "1.8.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["http1", "server", "service", "tokio"] }
moka = { version = "0.12.11", features = ["future"] }
object_store = "0.14.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.52.3", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "test-util",
    "time",
] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
ulid = "1.2.1"

[workspace.lints.rust]
unsafe_code = "forbid"
